schema_version: 5
status: staged
governance:
  framework_revision: replace-with-pinned-agentic-pipelines-revision
  authority_policy: coherent-semantic-units-v3
  accepted_exceptions: []
semantic_design:
  semantic_unit: replace-with-smallest-coherent-semantic-decision
  example_strategy: none
  example_roles: []
  example_selection: explain-selection-or-why-examples-are-inappropriate
  session_boundary: retained-session-or-justified-fresh-session
  review_scope: exact-goal-or-requested-delta-and-direct-consequences
  blocking_authority: deterministic_exact_semantic_scoped_human_policy
  stage_split_justification: none-or-observed-risk-context-isolation-reuse-quality-reason
  lossy_intermediate_policy: none-or-declared-limited-authority-preservation-fallback
  risk_tier: routine
pipeline_definition: pipeline.yaml
goal_traceability: []
authority_matrix: []
prompt_files: []
validator_files: []
fixture_manifest: fixtures.yaml
api_sample: api.sample.yaml
scheduler_example: scheduler.example.txt
evidence_policy:
  machine_report: reports/{pipeline_id}/{run_id}.json
  human_report: reports/{pipeline_id}/{run_id}.md
  rejected_artifact_pattern: artifacts/rejected/{entity}/{artifact}.{sequence}.rejected.{ext}
  rejected_stage_pattern: artifacts/rejected/{entity}/{artifact}.{sequence}.rejected.{stage}.{ext}
  rejected_explanation_pattern: artifacts/rejected/{entity}/{artifact}.{sequence}.rejected[.{stage}].explanation.md
  diagnostic_render:
    available: false
    input_format: markdown
    output_format: pdf
    child_pattern: '{artifact}.{sequence}.rejected.render.pdf'
    failure_behavior: preserve_parent_and_write_render_failure_child
  rejected_artifact_retention: retain until explicit governed cleanup
  excluded_from: [git, source_discovery, example_retrieval, prompt_assembly, rendering, promotion, semantic_evidence]
  failure_if_unwritable: true
rollback_notes: []
unresolved_decisions: []
