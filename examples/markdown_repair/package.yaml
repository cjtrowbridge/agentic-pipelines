schema_version: 5
status: staged
governance:
  framework_revision: deterministic-semantic-human-v1
  authority_policy: coherent-semantic-units-v3
  accepted_exceptions: []
semantic_design:
  semantic_unit: Repair one Markdown document while preserving its declared meaning and exact protected representations.
  example_strategy: representative_pairs
  example_roles: [behavior, boundary_behavior, negative_behavior]
  example_selection: Use the versioned normal, malformed, adversarial, and unrepairable fixtures as complete demonstrations during evaluation; runtime source remains one entity.
  session_boundary: Retain source, candidate, scoped audit, and one repair in one session; use the declared independent reviewer only because this reference package demonstrates the high-assurance option.
  review_scope: Meaning preservation for changed prose after exact structural gates.
  blocking_authority: Exact validators block representation defects; the scoped semantic reviewer blocks meaning changes; unresolved ambiguity escalates to a human.
  stage_split_justification: Independent review is retained as a deliberate high-assurance reference fixture, not a universal default.
  lossy_intermediate_policy: No lossy semantic derivative may replace the Markdown source.
  risk_tier: high_assurance
pipeline_definition: pipeline.yaml
goal_traceability:
  - requirement: Repair ambiguous Markdown structure.
    stage: worker
    verification: deterministic structure gates followed by independent semantic review
  - requirement: Preserve front matter exactly.
    stage: deterministic validation
    verification: parsed source and candidate front matter equality
  - requirement: Preserve prose meaning.
    stage: reviewer
    verification: bounded semantic verdict after deterministic validation
  - requirement: Fail safely when intended meaning is unavailable.
    stage: worker
    verification: unable result produces terminal quarantine
authority_matrix:
  - id: markdown.structure
    property: Candidate parses and preserves declared Markdown structure.
    property_class: representational
    mechanism: parser
    authority: deterministic
    proof_basis: schema
    heuristic_role: none
    evidence: Stable validator codes and parsed source/candidate structure.
    repair_owner: deterministic
    escalation: Quarantine if safe normalization cannot establish conformance.
  - id: markdown.meaning
    property: Candidate prose faithfully preserves source meaning.
    property_class: semantic
    mechanism: llm
    authority: semantic_model
    proof_basis: semantic_rubric
    heuristic_role: none
    evidence: Independent reviewer verdict over source and candidate.
    repair_owner: semantic_model
    escalation: Quarantine or require human review when support is ambiguous.
prompt_files: [prompts/worker.md, prompts/reviewer.md, prompts/repair.md, prompts/failure-analysis.md, prompts/remediation.md, prompts/performance.md]
validator_files: []
fixture_manifest: fixtures.yaml
api_sample: api.sample.yaml
scheduler_example: scheduler.example.txt
evidence_policy:
  machine_report: reports/{run_id}.json
  human_report: reports/{run_id}.md
  rejected_artifact_pattern: artifacts/rejected/{entity}/{artifact}.{sequence}.rejected.{ext}
  rejected_stage_pattern: artifacts/rejected/{entity}/{artifact}.{sequence}.rejected.{stage}.{ext}
  rejected_explanation_pattern: artifacts/rejected/{entity}/{artifact}.{sequence}.rejected[.{stage}].explanation.md
  diagnostic_render:
    available: false
    input_format: markdown
    output_format: pdf
    child_pattern: '{artifact}.{sequence}.rejected.render.pdf'
    failure_behavior: preserve_parent_and_write_render_failure_child
  rejected_artifact_retention: retain until explicit governed cleanup
  excluded_from: [git, source_discovery, example_retrieval, prompt_assembly, rendering, promotion, semantic_evidence]
  failure_if_unwritable: true
rollback_notes:
  - Promotion is disabled in the reference package.
  - Accepted artifacts remain separate from fixture sources.
unresolved_decisions: []
